name: Release BC Helperis

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          zip -r BC-helperis.zip \
            manifest.json \
            content.js \
            background.js \
            popup.html \
            popup.js \
            styles.css \
            icons \
            UZSTADISANAS_PAMACIBA.txt \
            README.md \
            -x "*.DS_Store" "*Thumbs.db*"

      - name: Extract Commit Message
        id: msg
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BC-helperis.zip
          name: BC helperis ${{ github.ref_name }}
          body: |
            ### 🚀 BC helperis ${{ github.ref_name }}

            ✨ **Jaunumi:** ${{ steps.msg.outputs.commit_msg }}

            #### 📦 Uzstādīšanas soļi:
            1. Lejupielādējiet **BC-helperis.zip** zemāk.
            2. Ar labo peles taustiņu uzspiediet uz faila un izvēlieties **Izvilkt visu... (Extract All)**.
            3. Atveriet pārlūku:
               - Edge: `edge://extensions`
               - Chrome: `chrome://extensions`
            4. Ieslēdziet **Izstrādātāja režīmu (Developer mode)**.
            5. Spiediet **Ielādēt neiepakotu (Load unpacked)** un norādiet izvilkto mapi.
